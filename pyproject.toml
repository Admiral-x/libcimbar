[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pycimbar"
version = "0.6.7.post1"
description = "Python bindings for libcimbar (color icon matrix barcodes)"
readme = "python/README.md"
license = "MPL-2.0"
# the wheel links these statically: their licenses travel with it
license-files = ["LICENSE", "python/LICENSE-OpenCV", "src/third_party_lib/*/LICENSE*", "src/third_party_lib/zstd/COPYING"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/Admiral-x/libcimbar"
Upstream = "https://github.com/sz3/libcimbar"

[tool.scikit-build]
cmake.source-dir = "python"
cmake.build-type = "Release"
minimum-version = "build-system.requires"
wheel.packages = ["python/src/pycimbar"]
# the native library is called through ctypes, so one wheel per platform serves every python version
wheel.py-api = "py3"
install.components = ["python"]
build-dir = "build/{wheel_tag}"
sdist.exclude = ["/web", "/samples", "/bitmap", "/test", "/.github", "/build", "/dist", "/.opencv-cache"]

[tool.cibuildwheel]
# py3-none wheels: building with one python is enough
build = "cp312-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "opencv-python-headless"]
test-sources = ["python/tests"]
test-command = "pytest -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
